<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <title>The Watchers Network</title>
    <!-- import stylesheets -->
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <main class="login-container">
        <section class="brand-section">
            <!-- floating posters - imports the picture from the web by URL -->
            <div class="floating-posters-container">
                <div class="floating-poster poster-1">
                    <img src="https://m.media-amazon.com/images/M/MV5BMjhlNTk4MTAtY2E2Yi00M2Y1LThiNGEtZWUzMGM3MmJlZmRmXkEyXkFqcGc@._V1_FMjpg_UX1000_.jpg"
                        alt="Sailor Moon">
                </div>
                <div class="floating-poster poster-2">
                    <img src="https://upload.wikimedia.org/wikipedia/en/b/b1/Pichi_pichi_pitch_pure.png"
                        alt="Mermaid Melody">
                </div>
                <div class="floating-poster poster-4">
                    <img src="https://static.wikia.nocookie.net/pixar/images/8/89/375F30EB-5286-4693-AD75-5D235D99979B.jpeg"
                        alt="Pixar">
                </div>
                <div class="floating-poster poster-5">
                    <img src="https://mediaproxy.tvtropes.org/width/1200/https://static.tvtropes.org/pmwiki/pub/images/civilwar_boxset_poster.webp"
                        alt="Marvel">
                </div>
                <div class="floating-poster poster-6">
                    <img src="https://images.penguinrandomhouse.com/cover/9780736440455" alt="Disney">
                </div>
            </div>
            <div class="brand-content">
                <h1 class="brand-logo">The Watchers</h1>
                <p class="brand-subtitle">Where All TV Lovers Have a Place to Be</p>
            </div>
        </section>

        <!-- right side form - login form -->
        <section class="form-section">
            <form class="split-card" action="/login" method="post">
                <h2>Log In to The Watchers</h2>

                <div class="input-group">
                    <input type="text" id="username" name="username" placeholder="Enter username" required>
                    <span class="validation-warning" id="username-warning">Only lowercase English letters and numbers
                        are allowed.</span>
                </div>

                <div class="input-group">
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="show-pass" onclick="toggleLoginPassword()">
                    <label for="show-pass">Show Password</label>
                </div>

                <button type="submit" class="btn btn-primary">Login</button>

                <a href="forgot-password.html" class="forgot-link">Forgot Password?</a>

                <hr class="divider">
                <a href="signup.html" class="btn btn-secondary">Create New Account</a>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Web Application Project - Shahaf Abraham, Nicole Klempert & Lior Shif</p>
    </footer>

    <script src="js/auth.js"></script>
</body>

</html>
