<!DOCTYPE html>

<html lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="utf-8" />
    <title>The Watchers Network</title>

    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <main class="login-container">
        <section class="brand-section">
            <div class="brand-content">
                <h1 class="brand-logo">The Watchers</h1>
                <p class="brand-subtitle">where All TV Lovers Have a Place to Be</p>
            </div>
        </section>

        <section class="form-section">
            <form class="split-card" action="/login" method="post">
                <h2>Log in to The Watchers</h2>

                <div class="input-group">
                    <input type="text" id="username" name="username" placeholder="Enter username" required>
                    <span class="validation-warning" id="username-warning">Only lowercase English letters and numbers
                        are allowed.</span>
                </div>

                <div class="input-group">
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="show-pass" onclick="toggleLoginPassword()">
                    <label for="show-pass">Show Password</label>
                </div>

                <button type="submit" class="btn btn-primary">Login</button>

                <a href="forgot-password.html" class="forgot-link">Forgot password?</a>

                <hr class="divider">
                <a href="signup.html" class="btn btn-secondary">Create New Account</a>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Web Application Project - Shahaf Abraham, Nicole Klempert & Lior Shif</p>
    </footer>

    <script src="js/auth.js"></script>
</body>

</html>
