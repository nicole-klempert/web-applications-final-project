<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>The Watchers Network</title>
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/modals.css">
    <link rel="stylesheet" href="css/avatars.css">
    <link rel="stylesheet" href="css/locationMap.css">
</head>

<body>
    <div class="app-layout">
        <nav class="side-nav">
            <header>
                <h1>The Watchers</h1>
            </header>
            <div class="nav-links mt-4">
                <a href="feed.html" class="nav-item"><i class="bi bi-house-door nav-icon"></i><span>Feed</span></a>
                <a href="profile.html" class="nav-item"><i class="bi bi-person nav-icon"></i><span>Profile</span></a>
                <a href="groups.html" class="nav-item"><i class="bi bi-people nav-icon"></i><span>Groups</span></a>
                <a href="map.html" class="nav-item active"><i
                        class="bi bi-geo-alt-fill nav-icon"></i><span>Map</span></a>
                <a href="statistics.html" class="nav-item"><i
                        class="bi bi-bar-chart nav-icon"></i><span>Statistics</span></a>
                <a href="#" class="nav-item" id="dark-mode-toggle"><i class="bi bi-moon-stars nav-icon"
                        id="dark-mode-icon"></i><span id="dark-mode-text">Dark Mode</span></a>
            </div>
            <button type="button" class="btn btn-primary logout-btn" id="logout-btn-trigger">Logout</button>
            <div class="account-card mt-auto">
                <div class="avatar avatar-purple" id="nav-user-avatar">US</div>
                <div><span class="name" id="nav-user-name">User Name</span><span class="handle"
                        id="nav-user-handle">@username</span></div>
            </div>
        </nav>
        <main class="map-main">
            <h2>Post Map</h2>
            <p id="map-description">Posts with a published location that you are allowed to view.</p>
            <div class="map-page-grid">
                <div id="posts-map" class="community-map"></div>
                <aside class="map-posts-panel">
                    <h3 id="map-posts-title">Posts on the map</h3>
                    <div id="map-posts-list"></div>
                </aside>
            </div>
        </main>
    </div>
    <script src="js/postLocation.js"></script>
    <script src="js/global.js"></script>
    <script src="js/mapManager.js"></script>
</body>

</html>
