<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <title>
        Groups
    </title>
    <link href="css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet"
          href="css/variables.css">
    <link rel="stylesheet"
          href="css/layout.css">
    <link rel="stylesheet"
          href="css/components.css">
    <link rel="stylesheet"
          href="css/groupsStyle.css">
</head>
<body>
    <div class="app-layout">
        <!-- LEFT NAV -->
        <nav class="side-nav">
            <header>
                <h1>
                    ~Name~
                </h1>
            </header>
            <div class="nav-links mt-4">
                <a href="feed.html"
                   class="nav-item">
                    <i class="bi bi-house-door-fill nav-icon"></i>
                    <span>
                        Feed
                    </span>
                </a>
                <a href="profile.html"
                   class="nav-item">
                    <i class="bi bi-person-fill nav-icon"></i>
                    <span>
                        Profile
                    </span>
                </a>
                <a href="groups.html"
                   class="nav-item active">
                    <i class="bi bi-people-fill nav-icon"></i>
                    <span>
                        Groups
                    </span>
                </a>
                <a href="#"
                   class="nav-item"
                   id="dark-mode-toggle">
                    <i class="bi bi-moon-stars nav-icon"
                       id="dark-mode-icon">
                    </i>
                    <span id="dark-mode-text">
                        Dark Mode
                    </span>
                </a>
            </div>
            <button type="button"
                    class="logout-btn"
                    id="logout-btn-trigger">
                Logout
            </button>
            <div class="account-card mt-auto"
                 role="button"
                 tabindex="0">
                <div class="avatar avatar-purple"
                     id="nav-user-avatar">
                    US
                </div>
                <div>
                    <span class="name"
                          id="nav-user-name">
                        User Name
                    </span>
                    <span class="handle"
                          id="nav-user-handle">
                        @username
                    </span>
                </div>
                <span class="account-menu">
                    ···
                </span>
            </div>
        </nav>
        <!-- MAIN -->
        <main class="main-feed">
            <div class="groups-header">
                <div>
                    <h2>
                        Groups
                    </h2>
                    <p>
                        Discover communities and connect with people.
                    </p>
                </div>
                <button type="button"
                        class="create-group-btn"
                        id="create-group-btn">
                    <i class="bi bi-plus-lg"></i>
                    Create Group
                </button>
            </div>
            <!-- SEARCH / FILTERS -->
            <section class="groups-filters">
                <div class="groups-search">
                    <i class="bi bi-search"></i>
                    <input type="search"
                           id="groups-search-input"
                           placeholder="Search by name or description...">
                </div>
                <select id="groups-category-filter"
                        class="groups-filter-control">
                    <option value="">
                        All Categories
                    </option>
                    <option value="Sports">
                        Sports
                    </option>
                    <option value="Movies & TV">
                        Movies & TV
                    </option>
                    <option value="Music">
                        Music
                    </option>
                    <option value="Technology">
                        Technology
                    </option>
                    <option value="Travel">
                        Travel
                    </option>
                    <option value="Food">
                        Food
                    </option>
                    <option value="Gaming">
                        Gaming
                    </option>
                    <option value="Books">
                        Books
                    </option>
                    <option value="Education">
                        Education
                    </option>
                    <option value="Other">
                        Other
                    </option>
                </select>
                <input type="text"
                       id="groups-city-filter"
                       class="groups-filter-control"
                       placeholder="Filter by city">
                <button type="button"
                        id="reset-group-filters"
                        class="group-cancel-btn">
                    Reset
                </button>
            </section>
            <!-- GROUP LIST -->
            <section id="groups-container"
                     class="groups-grid">
                <p class="groups-loading">
                    Loading groups...
                </p>
            </section>
            <!-- LOAD MORE -->
            <div class="groups-load-more-container">
                <button type="button"
                        id="groups-load-more-btn"
                        class="create-group-btn"
                        style="display: none;">
                    Load More
                </button>
            </div>
        </main>
        <!-- RIGHT SIDEBAR -->
        <aside class="right-sidebar">
            <h3>
                My Groups
            </h3>
            <p class="sidebar-description">
                Groups you have joined will appear here.
            </p>
            <div id="my-groups-container">
            </div>
        </aside>
    </div>
    <!-- CREATE GROUP MODAL -->
    <div id="create-group-modal"
         class="modal-overlay">
        <div class="group-modal-content">
            <div class="group-modal-header">
                <h3>
                    Create Group
                </h3>
                <button type="button"
                        id="close-create-group-modal"
                        class="modal-close-btn">
                    ×
                </button>
            </div>
            <form id="create-group-form">
                <label for="group-name">
                    Group Name *
                </label>
                <input type="text"
                       id="group-name"
                       maxlength="80"
                       required>
                <label for="group-description">
                    Description
                </label>
                <textarea id="group-description"
                          maxlength="500"
                          rows="4">
            </textarea>
                <label for="group-category">
                    Category
                </label>
                <select id="group-category">
                    <option value="">
                        Select category
                    </option>
                    <option value="Sports">Sports</option>
                    <option value="Movies & TV">
                        Movies & TV
                    </option>
                    <option value="Music">Music</option>
                    <option value="Technology">
                        Technology
                    </option>
                    <option value="Travel">Travel</option>
                    <option value="Food">Food</option>
                    <option value="Gaming">Gaming</option>
                    <option value="Books">Books</option>
                    <option value="Education">
                        Education
                    </option>
                    <option value="Other">Other</option>
                </select>
                <label for="group-address">
                    Address
                </label>
                <input type="text"
                       id="group-address"
                       maxlength="200">
                <label for="group-city">
                    City
                </label>
                <input type="text"
                       id="group-city"
                       maxlength="100">
                
                <label for="group-image">
                    Group Image
                </label>
                <input type="file"
                       id="group-image"
                       accept="image/*">
                <div id="group-image-preview-container"
                     class="group-image-preview-container">
                    <img id="group-image-preview"
                         alt="Group preview">
                </div>
                <div id="create-group-error"
                     class="group-form-error">
                </div>
                <div class="group-modal-actions">
                    <button type="button"
                            id="cancel-create-group"
                            class="group-cancel-btn">
                        Cancel
                    </button>
                    <button type="submit"
                            class="create-group-btn">
                        Create Group
                    </button>
                </div>
            </form>
        </div>
    </div>
    <script src="js/global.js"></script>
    <script src="js/groupsManager.js"></script>
</body>
</html>
